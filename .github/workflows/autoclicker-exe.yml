name: Build Auto Clicker .exe

on:
  push:
    paths:
      - "tools/autoclicker/**"
      - ".github/workflows/autoclicker-exe.yml"
  workflow_dispatch:

permissions:
  contents: write  # to publish the .exe as a release download

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/autoclicker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Test matching
        run: python -m pytest -q

      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AutoClicker
          --icon assets/icon.png
          --add-data "assets;assets"
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          gui.py

      - name: Check the .exe starts
        shell: pwsh
        run: |
          $env:SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process dist\AutoClicker.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker
          path: tools/autoclicker/dist/AutoClicker.exe

      - name: Publish download link
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-thread-ie5jp9'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autoclicker
          target_commitish: ${{ github.sha }}
          name: Auto Clicker
          body: |
            Download **AutoClicker.exe** below and open it.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.
            How to use: see tools/autoclicker/README.md.
          files: tools/autoclicker/dist/AutoClicker.exe
          make_latest: true
